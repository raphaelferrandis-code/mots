# Mise en ligne automatique sur GitHub Pages.
# À chaque envoi de code sur la branche « main », GitHub vérifie le projet (tests), fabrique le site
# et le publie. Rien à faire à la main.
#
# À régler une seule fois sur github.com : Settings → Pages → Source : « GitHub Actions ».
#
# Les actions sont figées par leur empreinte (SHA), pas par « @v4 » : une étiquette peut être déplacée par son
# auteur (ou par quelqu'un qui lui aurait volé l'accès), une empreinte jamais. La version est notée à côté.

name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch: # permet aussi de relancer à la main depuis l'onglet « Actions »

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  fabriquer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Prépare l'interface ; l'ouverture reste commandée par le serveur.
          VITE_PAIEMENTS_PRODUCTION: 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  publier:
    needs: fabriquer
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
