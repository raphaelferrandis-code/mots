<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1729" />
    <title>Philamots — collectionne les mots de la langue française</title>
    <meta name="description" content="Philamots : un jeu de cartes à collectionner où chaque carte est un vrai mot de la langue française, imprimé comme un timbre-poste. 3 000 timbres, des duels de définitions. Gratuit, sans rien installer." />
    <link rel="canonical" href="https://philamots.fr/" />
    <link rel="icon" type="image/png" sizes="32x32" href="./identite/icone-site-32.png" />
    <link rel="icon" type="image/svg+xml" href="./identite/favicon-site.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./identite/icone-site-180.png" />

    <!-- L'aperçu d'un lien partagé (WhatsApp, Facebook, Discord, X…). Les adresses doivent être complètes.
         L'image se refabrique avec scripts/fabriquer-la-vignette.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Philamots" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://philamots.fr/" />
    <meta property="og:title" content="Philamots — collectionne les mots de la langue française" />
    <meta property="og:description" content="3 000 timbres à collectionner, des duels de définitions. Gratuit, sans rien installer." />
    <meta property="og:image" content="https://philamots.fr/identite/vignette-partage.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Le logo Philamots et trois timbres du jeu : rodomontade, sérendipité et amour." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Ce qu'est le site, dit aux moteurs de recherche. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Philamots",
        "url": "https://philamots.fr/",
        "image": "https://philamots.fr/identite/vignette-partage.jpg",
        "description": "Un jeu de cartes à collectionner où chaque carte est un vrai mot de la langue française, imprimé comme un timbre-poste.",
        "inLanguage": "fr",
        "genre": ["Jeu de cartes à collectionner", "Jeu de mots"],
        "gamePlatform": "Navigateur web",
        "applicationCategory": "Game",
        "operatingSystem": "Tous",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
  </head>
  <body>
    <div id="racine"></div>
    <noscript>
      <p>Philamots est un jeu de cartes à collectionner où chaque carte est un vrai mot de la langue française,
        imprimé comme un timbre-poste. Pour jouer, active JavaScript dans ton navigateur.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
