<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1729" />
    <!-- Le jeu est sombre par nature : le mode sombre forcé des navigateurs (Chrome, Samsung Internet) ne doit pas
         l'assombrir à nouveau, sinon le papier des timbres et de la feuille devient brun et leurs trous gris clair. -->
    <meta name="color-scheme" content="dark" />
    <title>Philamots — collectionne les mots de la langue française</title>
    <meta name="description" content="Philamots : un jeu de cartes à collectionner où chaque carte est un vrai mot de la langue française, imprimé comme un timbre-poste. 3 000 timbres, des duels de définitions. Gratuit, sans rien installer." />
    <meta name="google-site-verification" content="y5hdiwbTS9TZA7JFV5mLwaycxCjdPuQekt6ZfKq9BaY" />
    <link rel="canonical" href="https://philamots.fr/" />
    <link rel="icon" type="image/png" sizes="32x32" href="./identite/icone-site-32.png" />
    <link rel="icon" type="image/svg+xml" href="./identite/favicon-site.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./identite/icone-site-180.png" />

    <!-- L'aperçu d'un lien partagé (WhatsApp, Facebook, Discord, X…). Les adresses doivent être complètes.
         L'image se refabrique avec scripts/fabriquer-la-vignette.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Philamots" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://philamots.fr/" />
    <meta property="og:title" content="Philamots — collectionne les mots de la langue française" />
    <meta property="og:description" content="3 000 timbres à collectionner, des duels de définitions. Gratuit, sans rien installer." />
    <meta property="og:image" content="https://philamots.fr/identite/vignette-partage.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Le logo Philamots et trois timbres du jeu : rodomontade, sérendipité et amour." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Ce qu'est le site, dit aux moteurs de recherche. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Philamots",
        "url": "https://philamots.fr/",
        "image": "https://philamots.fr/identite/vignette-partage.jpg",
        "description": "Un jeu de cartes à collectionner où chaque carte est un vrai mot de la langue française, imprimé comme un timbre-poste.",
        "inLanguage": "fr",
        "genre": ["Jeu de cartes à collectionner", "Jeu de mots"],
        "gamePlatform": "Navigateur web",
        "applicationCategory": "Game",
        "operatingSystem": "Tous",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>

    <!-- L'attente, avant que le jeu ne se charge (sinon, une page vide 1 à 3 s sur un réseau lent). Le jeu la remplace
         dès qu'il démarre ; elle n'apparaît qu'au bout d'un instant, pour ne pas clignoter quand tout va vite. Les
         feuilles de style du jeu sont placées après elle (vite.config.ts, « attente-d-abord ») : elle se peint aussitôt. -->
    <style>
      html, body { background: #0b1729; }
      .attente-initiale { min-height: 100vh; min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 18px;
        color: #adc3da; font: 15px/1.4 'Segoe UI', system-ui, sans-serif; text-align: center; padding: 0 16px; opacity: 0; animation: attente-apparait .3s ease-out .15s forwards; }
      .attente-initiale img { width: 180px; height: auto; animation: attente-respire 2.4s ease-in-out infinite; }
      .attente-initiale p { margin: 0; max-width: 28em; }
      .attente-initiale__recharger { min-height: 44px; padding: 10px 18px; border: 1px solid #587795; border-radius: 6px; background: #182e48; color: #e0edfa; font: inherit; cursor: pointer; }
      @keyframes attente-apparait { to { opacity: 1; } }
      @keyframes attente-respire { 50% { opacity: .55; } }
      @media (prefers-reduced-motion: reduce) { .attente-initiale img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="racine"><div class="attente-initiale" role="status"><img src="./identite/philamots-clair.svg" alt="Philamots" width="180" height="43" /><p>Chargement du jeu…</p></div></div>
    <!-- feuilles-du-jeu -->
    <!-- Si le jeu ne démarre pas, l'attente le dit au bout de 12 s et propose de recharger (public/demarrage.js). -->
    <script src="./demarrage.js" async></script>
    <noscript>
      <p>Philamots est un jeu de cartes à collectionner où chaque carte est un vrai mot de la langue française,
        imprimé comme un timbre-poste. Pour jouer, active JavaScript dans ton navigateur.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
