<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Philamots · Ouverture en feuille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,700&family=Jost:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#0a1322;--desk:#0a1322;--cuivre:#d89a5c;--cuivre-clair:#f0c48f;--papier:#f1e7d0;--texte:#e4dccb;--texte-doux:#a7b1c4;--ligne:rgba(233,225,208,.12);--ok:#6fd49a;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Jost","Futura","Century Gothic","Trebuchet MS",sans-serif;
  --cond:"Oswald","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--nuit:#0a1322}}
:root[data-theme="dark"]{--nuit:#0a1322}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#060b16}
body{margin:0;min-height:100vh;color:var(--texte);font-family:var(--sans);font-size:16.5px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;background:radial-gradient(ellipse 75% 65% at 50% 45%,#15274c 0%,#0b1628 50%,#04070f 100%) fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cuivre-clair);outline-offset:3px}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;background-image:var(--noise);opacity:.12;mix-blend-mode:overlay}

.app{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto}
.top{display:flex;align-items:center;gap:12px;padding:12px clamp(16px,3vw,40px)}
.logo{font-family:var(--serif);font-style:italic;font-weight:500;font-size:27px;line-height:1;color:var(--papier)}
.top .tag{font-family:var(--serif);font-style:italic;color:var(--texte-doux);font-size:15px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:1px solid transparent;background:none;color:var(--texte-doux);cursor:pointer}
.icon-btn:hover{color:var(--papier);border-color:var(--ligne)}.icon-btn svg{width:21px;height:21px}
.snd[aria-pressed="true"] .w{display:none}.snd[aria-pressed="false"] .x{display:none}
.btn-primary{height:56px;padding:0 34px;display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:17px;color:#2a1605;background:linear-gradient(180deg,#f6d3a2,#df9f63 52%,#c47d43);
  -webkit-mask:radial-gradient(circle 4.5px at 50% 0,#0000 96%,#000) 50% 0/15px 51% repeat-x,radial-gradient(circle 4.5px at 50% 100%,#0000 96%,#000) 50% 100%/15px 51% repeat-x;
  mask:radial-gradient(circle 4.5px at 50% 0,#0000 96%,#000) 50% 0/15px 51% repeat-x,radial-gradient(circle 4.5px at 50% 100%,#0000 96%,#000) 50% 100%/15px 51% repeat-x;transition:transform .2s,filter .2s}
.btn-primary:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn-primary:focus-visible{outline:none;filter:brightness(1.15);box-shadow:inset 0 0 0 3px #2a1605}
.btn-secondary{height:46px;padding:0 20px;display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(216,154,92,.55);background:rgba(216,154,92,.06);color:var(--papier);border-radius:3px;font-weight:500;font-size:15.5px;cursor:pointer;transition:background .2s,border-color .2s}
.btn-secondary:hover{background:rgba(216,154,92,.14);border-color:var(--cuivre)}
.btn-secondary svg{width:18px;height:18px}
.link-btn{background:none;border:0;padding:8px;cursor:pointer;color:var(--texte-doux);text-decoration:underline;text-underline-offset:5px;text-decoration-color:rgba(167,177,196,.5);font-size:15px}
.link-btn:hover{color:var(--papier)}

.stage{position:relative;display:grid;place-items:center;min-height:0;padding:6px 12px;touch-action:none;user-select:none;-webkit-user-select:none;
  --pw:max(170px,min(300px,60vw,calc((100vh - 330px)*.66)))}
@supports (height:100dvh){.stage{--pw:max(170px,min(300px,60vw,calc((100dvh - 330px)*.66)))}}
.stage>*{grid-area:1/1}
.c-pack-wrap{position:relative;z-index:3}

/* the sheet */
.sheet-wrap{position:relative;z-index:2;perspective:2000px}
.tilt{transform-style:flat;will-change:transform}
.sheet{position:relative;will-change:transform}
.sface{position:relative;width:100%;aspect-ratio:var(--ar);box-shadow:0 30px 60px rgba(0,0,0,.55),0 4px 8px rgba(0,0,0,.35)}
.sface>.paper{position:absolute;inset:0;background:radial-gradient(130% 110% at 25% 12%,#fcf6e6 0%,#f1e5ca 60%,#e4d3ae 100%)}
.sface>.paper::after{content:"";position:absolute;inset:0;background-image:var(--noise);opacity:.45;mix-blend-mode:multiply}
.sface.sback>.paper{background:radial-gradient(130% 110% at 30% 12%,#fbf6e8,#eee2c4 62%,#e0cfa8)}
.sface.sback>.paper::before{content:"";position:absolute;inset:0;background-image:var(--wm);background-size:calc(var(--u) * 46) calc(var(--u) * 46);opacity:.6}
.gum{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 46%,transparent 62%);background-size:260% 260%;background-position:calc(var(--mx,.3)*100%) 0;mix-blend-mode:soft-light}
.marg,.perfs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.perfs{z-index:4}
.cell{position:absolute;z-index:2;padding:0;border:0;background:none;display:block}
.cell.stampcell{cursor:pointer}
.cell .stamp{position:absolute;inset:0;transition:transform .25s cubic-bezier(.2,.8,.2,1),filter .25s}
.insheet .face{-webkit-mask:none!important;mask:none!important}
@media (hover:hover){.sface.sfront .stampcell:hover .stamp{transform:translateY(-5px);filter:drop-shadow(0 12px 14px rgba(0,0,0,.4))}}
.bcell{position:absolute;z-index:3;padding:0;border:0;background:none;cursor:pointer;transition:box-shadow .25s,background .25s}
.bcell:hover{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 2px rgba(216,154,92,.55)}
.bcell:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--cuivre-clair)}
.bcell .num{position:absolute;left:50%;bottom:9%;translate:-50% 0;font-family:var(--cond);font-size:calc(var(--u) * 13);letter-spacing:.2em;color:rgba(110,80,40,.5)}
.bcell .ghost{position:absolute;inset:18%;border-radius:50%;pointer-events:none;opacity:0}
.bcell.g-dore .ghost{opacity:1;background:radial-gradient(circle,rgba(255,200,120,.5),rgba(255,200,120,0) 70%);animation:gp 2.2s ease-in-out infinite}
.bcell.g-holo .ghost{opacity:1;background:radial-gradient(circle,rgba(160,210,255,.55),rgba(255,120,190,.25) 45%,rgba(255,255,255,0) 72%);animation:gh 2.6s linear infinite}
.bcell.g-faute .ghost{opacity:1;background:radial-gradient(circle,rgba(230,40,70,.45),rgba(230,40,70,0) 70%);animation:gf 1s steps(2) infinite}
@keyframes gp{50%{opacity:.35;transform:scale(.9)}}
@keyframes gh{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
@keyframes gf{0%{opacity:1;translate:0 0}50%{opacity:.5;translate:1px -1px}}
.hole{position:absolute;z-index:3;background:var(--desk);box-shadow:inset 0 10px 20px rgba(0,0,0,.6)}
.labelcell{position:absolute;z-index:2;display:grid;place-items:center;text-align:center;overflow:hidden}
.labelcell svg{width:100%;height:100%;display:block}
.flap{position:absolute;left:0;right:0;bottom:0;height:50%;overflow:hidden;transform-origin:50% 0;backface-visibility:hidden;-webkit-backface-visibility:hidden;z-index:6}
.flap>.sface{position:absolute;left:0;right:0;bottom:0;box-shadow:none}

/* ---------- pack ---------- */
.pack{position:relative;width:var(--pw);aspect-ratio:320/470;perspective:1200px}
.pack-tilt{position:absolute;inset:0;filter:drop-shadow(0 36px 34px rgba(0,0,0,.55)) drop-shadow(0 6px 8px rgba(0,0,0,.35));will-change:transform}
.p-body{position:absolute;left:0;right:0;bottom:0;top:calc(48/470*100%)}
.p-body svg,.p-strip svg{display:block;width:100%;height:100%}
.p-foil,.p-glare{position:absolute;inset:0;pointer-events:none;-webkit-mask:var(--packmask) center/100% 100% no-repeat;mask:var(--packmask) center/100% 100% no-repeat}
.p-foil{background:linear-gradient(115deg,transparent 30%,rgba(255,214,160,.26) 44%,rgba(170,205,255,.2) 52%,transparent 64%);background-size:260% 260%;background-position:calc(var(--mx,.5)*100%) calc(var(--my,.5)*100%);mix-blend-mode:screen}
.p-glare{background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.25),transparent 46%);mix-blend-mode:soft-light}
.p-strip{position:absolute;left:0;right:0;top:0;height:calc(52/470*100%)}
.p-strip .s{position:absolute;inset:0}
.tear-hint{display:none;position:absolute;top:calc(48/52*100%);left:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffe2b4 30%,rgba(240,196,143,0) 70%);pointer-events:none;animation:hint 1.9s cubic-bezier(.45,0,.55,1) infinite}
.c-pack .tear-hint{display:block}
.tear-hint.off{display:none}
@keyframes hint{0%{left:3%;opacity:0}15%{opacity:1}80%{opacity:1}100%{left:97%;opacity:0}}


/* ---------- stamps ---------- */
.stamp{position:relative;width:100%;aspect-ratio:30/38;container-type:inline-size}
.stamp .scale{position:absolute;inset:0;font-size:calc(100cqw / 30)}
.face{position:absolute;inset:0;overflow:hidden;-webkit-mask:var(--perf) center/100% 100% no-repeat;mask:var(--perf) center/100% 100% no-repeat}
.paper{position:absolute;inset:0;background:radial-gradient(130% 100% at 25% 12%,#fcf6e6 0%,#f0e4c8 58%,#e1cfa8 100%)}
.paper::after{content:"";position:absolute;inset:0;background-image:var(--noise);opacity:.5;mix-blend-mode:multiply}
.print{position:absolute;inset:2.15em;overflow:hidden;background-color:var(--ink);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 .09em,transparent .09em .27em),radial-gradient(120% 90% at 50% 38%,rgba(255,255,255,.14),rgba(0,0,0,.3));box-shadow:inset 0 0 0 .14em rgba(0,0,0,.3)}
.print::after{content:"";position:absolute;inset:.6em;border:.08em solid rgba(246,236,214,.45);pointer-events:none}
.print-top{position:absolute;top:1.05em;left:1.25em;right:1.1em;display:flex;justify-content:space-between;align-items:flex-start;font-family:var(--cond);font-weight:500;font-size:1em;line-height:1.18;letter-spacing:.2em;text-transform:uppercase;color:rgba(246,236,214,.88)}
.val{font-family:var(--serif);font-weight:900;font-size:2.7em;line-height:.85;letter-spacing:0;color:#f7eed9}
.val small{font-family:var(--cond);font-weight:500;font-size:.34em;letter-spacing:.12em;margin-left:.12em}
.vignette{position:absolute;left:50%;top:48.5%;width:21.5em;height:21.5em;translate:-50% -50%}
.vignette svg{display:block;width:100%;height:100%;overflow:visible}
.vignette .ln{stroke:#f6ecd6;fill:none}
.vignette .vg-disc{fill:var(--ink)}
.vignette .ini{font-family:var(--serif);font-style:italic;font-weight:700;font-size:66px;fill:#f7eed9}
.print-word{position:absolute;left:.4em;right:.4em;bottom:1.15em;text-align:center;white-space:nowrap;font-family:var(--cond);font-weight:600;font-size:var(--wsize,2em);letter-spacing:.13em;text-transform:uppercase;color:#f7eed9;line-height:1}
.imprint{position:absolute;left:0;right:0;bottom:.82em;text-align:center;font-family:var(--cond);font-size:.72em;letter-spacing:.22em;text-transform:uppercase;color:rgba(78,54,26,.62)}
.foil,.glare{position:absolute;inset:0;pointer-events:none}
.glare{background:radial-gradient(circle at var(--gx,32%) var(--gy,22%),rgba(255,255,255,.5),rgba(255,255,255,0) 52%);mix-blend-mode:soft-light}
.postmark{position:absolute;right:-6.6em;top:4.6em;width:23.5em;rotate:-14deg;opacity:0;color:#141a2c;mix-blend-mode:multiply;pointer-events:none}
.postmark svg{display:block;width:100%;height:auto;overflow:visible}
.faute-mark{position:absolute;left:.95em;bottom:2.05em;rotate:-16deg;padding:.12em .55em .18em;border:.12em solid #d7263f;outline:.05em solid #d7263f;outline-offset:.18em;font-family:var(--cond);font-weight:600;font-size:2.7em;letter-spacing:.16em;line-height:1.1;text-transform:uppercase;color:#e0293f;background:rgba(255,245,240,.1);opacity:0;pointer-events:none}
.stamped .postmark{opacity:.82}
.stamped .faute-mark{opacity:.94}

/* dorés à chaud */
.r-dore .print{box-shadow:inset 0 0 0 .2em #c8914b,inset 0 0 0 .38em rgba(0,0,0,.3),inset 0 0 0 .5em #efca8b}
.r-dore .print::after{border-color:rgba(240,200,140,.7)}
.r-dore .vignette .ln{stroke:#edcb8f}
.r-dore .vignette .ini{fill:#f5d9a0}
.r-dore .print-word,.r-dore .val{background:linear-gradient(100deg,#b07634,#fbe2ad 38%,#c88a44 58%,#fde9bd 80%,#b87d3a);-webkit-background-clip:text;background-clip:text;color:transparent}
.r-dore .foil{background:linear-gradient(115deg,transparent 36%,rgba(255,226,160,.6) 47%,rgba(255,248,222,.95) 50%,rgba(255,226,160,.55) 53%,transparent 64%);background-size:300% 300%;background-position:calc(var(--mx,.5)*100%) 50%;mix-blend-mode:overlay}
/* holographique */
.r-holo .foil{background:repeating-linear-gradient(118deg,#ff5f8f 0%,#ffd36b 6%,#7dffb0 12%,#6bd4ff 18%,#b58bff 24%,#ff5f8f 30%),radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.55),transparent 55%);background-size:420% 420%,100% 100%;background-position:calc(var(--mx,.5)*100%) calc(var(--my,.5)*100%),0 0;mix-blend-mode:color-dodge;opacity:.6}
.r-holo .foil::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.95) 0 .06em,transparent .11em),radial-gradient(circle,rgba(255,255,255,.75) 0 .045em,transparent .09em);background-size:3.1em 2.7em,1.9em 2.3em;background-position:calc(var(--mx,.5)*3em) calc(var(--my,.5)*2em),calc(var(--my,.5)*-2em) calc(var(--mx,.5)*1.5em);mix-blend-mode:screen;opacity:.8}
.r-holo .print-word{text-shadow:0 0 .4em rgba(160,220,255,.5)}
/* fautés */
.r-faute .vignette{rotate:180deg}
.r-faute .vghost{mix-blend-mode:screen;opacity:.75}
.r-faute .vghost svg{transform:translate(1.4%,-1.1%);animation:jit 3.2s steps(1) infinite}
.r-faute .vghost .ln{stroke:#ff3d6e}
.r-faute .vghost .ini{fill:#ff3d6e}
.r-faute .vghost .vg-disc{fill:none}
.r-faute .print-word{text-shadow:.09em 0 rgba(255,60,100,.8),-.09em 0 rgba(70,220,255,.65)}
.r-faute .paper{background:radial-gradient(130% 100% at 25% 12%,#f7eed8 0%,#eadbb8 58%,#d6c091 100%)}
@keyframes jit{0%,84%,100%{transform:translate(1.4%,-1.1%)}86%{transform:translate(-1.8%,.9%)}90%{transform:translate(2.6%,.4%)}94%{transform:translate(.6%,-2.2%)}}

/* verso */
.back .bpaper{position:absolute;inset:0;background:radial-gradient(130% 100% at 30% 10%,#fcf7e9,#eee2c5 62%,#dfcca5)}
.back .wm{position:absolute;inset:0;background-image:var(--wm);background-size:4.6em 4.6em;opacity:.5}
.back .seal{position:absolute;left:50%;top:45%;width:10.5em;height:10.5em;translate:-50% -50%;border-radius:50%;border:.18em solid rgba(140,100,50,.4);box-shadow:inset 0 0 0 .7em rgba(140,100,50,.05),inset 0 0 0 .82em rgba(140,100,50,.28);display:grid;place-items:center}
.back .seal span{font-family:var(--serif);font-style:italic;font-weight:700;font-size:6.2em;line-height:1;color:rgba(128,90,42,.5)}
.back .bnote{position:absolute;left:0;right:0;bottom:3.4em;text-align:center;font-family:var(--serif);font-style:italic;font-size:1.3em;color:rgba(110,80,40,.62)}
.back .gum{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 46%,transparent 62%);background-size:260% 260%;background-position:calc(var(--mx,.3)*100%) 0;mix-blend-mode:soft-light}


.cell .stamp,.fly>.stamp,.focus-slot .stamp,.tslot .stamp{width:100%}
.stamp.facedown .front{visibility:hidden}
.stamp:not(.facedown) .back{visibility:hidden}

/* focus */
.veil{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 42%,rgba(14,26,50,.86),rgba(4,7,15,.97));opacity:0;pointer-events:none;transition:opacity .4s}
.veil.on{opacity:1;pointer-events:auto}
.focus{position:fixed;inset:0;z-index:21;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:70px 16px 24px;pointer-events:none;
  --fw:max(160px,min(300px,64vw,calc((100vh - 360px)*.79)))}
@supports (height:100dvh){.focus{--fw:max(160px,min(300px,64vw,calc((100dvh - 360px)*.79)))}}
.focus.on{pointer-events:auto}
.focus-slot{position:relative;width:var(--fw);aspect-ratio:30/38;perspective:1100px;cursor:pointer}
.focus-slot .tiltf{position:absolute;inset:0;transition:transform .14s ease-out;filter:drop-shadow(0 24px 26px rgba(0,0,0,.55))}
.focus-slot .flipf{position:absolute;inset:0}
.focus-slot .stamp{position:absolute;inset:0}
.focus-info{min-height:150px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;opacity:0;transition:opacity .3s}
.focus.show-info .focus-info{opacity:1}
.fly{position:fixed;z-index:25;left:0;top:0;transform-origin:0 0;pointer-events:none;filter:drop-shadow(0 20px 26px rgba(0,0,0,.5))}
.fly>.stamp{position:absolute;inset:0}

body.focusing .info,body.focusing .tray{visibility:hidden}
.info{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:6px 16px 4px;min-height:118px}
.hint-t{margin:0;font-family:var(--serif);font-style:italic;font-size:clamp(18px,2vw,22px);color:var(--papier);max-width:36em}
.sub-t{margin:0;font-size:14.5px;color:var(--texte-doux)}
.acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:4px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:13px;font-weight:500;padding:3px 11px;border-radius:99px;border:1px solid currentColor;line-height:1.5}
.chip.courant{color:#b9c3d6}.chip.dore{color:var(--cuivre-clair)}
.chip.holo{border:0;color:#1b1330;background:linear-gradient(90deg,#ff8fb0,#ffe38a,#9dffc8,#8fdcff,#cfaeff)}
.chip.faute{border:0;color:#fff;background:#c81f38}
.chip.new{color:#9ad9b2}.chip.dup{color:#b9c3d6}
.w-word{margin:2px 0 0;font-family:var(--serif);font-weight:900;font-size:clamp(30px,4.4vw,44px);line-height:1.02;color:var(--papier)}
.w-def{margin:0;max-width:30em;font-size:16px;color:var(--texte)}
.w-def em{font-family:var(--serif);color:var(--cuivre-clair);margin-right:6px}
.sum-title{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(30px,4.4vw,44px);line-height:1.02;color:var(--papier)}

.tray{position:relative;z-index:5;display:flex;justify-content:center;gap:clamp(8px,2vw,16px);padding:6px 0 calc(18px + env(safe-area-inset-bottom,0px))}
.tslot{position:relative;width:clamp(42px,10vw,58px);aspect-ratio:30/38;background:rgba(233,225,208,.05);-webkit-mask:var(--perf) center/100% 100% no-repeat;mask:var(--perf) center/100% 100% no-repeat;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.tslot::before{content:"";position:absolute;inset:16%;border:1px dashed rgba(233,225,208,.2)}
.tslot.filled{background:none}.tslot.filled::before{display:none}
.tslot .stamp{position:absolute;inset:0}
.tray.big .tslot{width:clamp(56px,14vw,92px)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;translate:-50% 0;max-width:calc(100% - 32px);padding:12px 18px;border-radius:6px;background:#1b2d4d;border:1px solid rgba(216,154,92,.4);color:var(--papier);font-size:15px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.flash{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,#fff,rgba(255,240,220,.6) 30%,rgba(255,200,200,0) 70%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}

    const pm = $('.postmark', st); pm && pm.animate([{opacity: 0, transform: 'scale(1.9)', filter: 'blur(3px)'}, {opacity: .82, transform: 'scale(1)', filter: 'blur(0)'}], {duration: D(180), easing: 'cubic-bezier(.6,0,.9,.5)', fill: 'forwards'});
    Sfx.thud(); st.classList.add('stamped');
    st.animate([{transform: 'scale(1)'}, {transform: 'scale(.95)'}, {transform: 'scale(1)'}], {duration: D(220)});
    if (rank === 1){ Sfx.chime(1); FX.burst(cx, cy, {n: 28, type: 'dust', colors: ['#ffe1a8', '#f0c48f', '#fff4d6'], speed: [50, 240], dur: [.6, 1.2]}); const f = $('.front .foil', st); f && f.animate([{backgroundPosition: '100% 50%'}, {backgroundPosition: '0% 50%'}], {duration: D(900)}); }
    if (rank === 2){ Sfx.shimmer(); Sfx.chime(2); FX.burst(cx, cy, {n: 50, type: 'spark', colors: ['#ff7aa2', '#ffe07a', '#8dffc0', '#7fd8ff', '#c49bff'], speed: [120, 460], dur: [.5, 1.1], size: [1.2, 2.4]}); }
    if (rank === 3){ Sfx.boom(); FX.burst(cx, cy, {n: 110, type: 'confetti', colors: ['#f0c48f', '#d0243e', '#f6ecd6', '#3557a8'], speed: [200, 700], g: 700, dur: [1.3, 2.4], size: [5, 10], drag: .97}); await wait(380); const fm = $('.faute-mark', st); fm && fm.animate([{opacity: 0, transform: 'scale(1.9)'}, {opacity: .94, transform: 'scale(1)'}], {duration: D(180), easing: 'cubic-bezier(.6,0,.9,.5)', fill: 'forwards'}); Sfx.thud(); }
    d.revealed = true;
    await wait(rank ? 520 : 330);
  }
}
function flashIt(){ $('#flash').animate([{opacity: 0}, {opacity: .85, offset: .15}, {opacity: 0}], {duration: D(700), easing: 'ease-out'}); }

/* ---------- detach one stamp ---------- */
const veil = $('#veil'), focus = $('#focus'), fslot = $('#focus-slot'), finfo = $('#focus-info');
function tearFX(r){ for (let i = 0; i < 20; i++){ const t = i / 20, side = Math.floor(t * 4), u = (t * 4) % 1; const x = side === 0 ? r.left + u * r.width : side === 1 ? r.right : side === 2 ? r.right - u * r.width : r.left; const y = side === 0 ? r.top : side === 1 ? r.top + u * r.height : side === 2 ? r.bottom : r.bottom - u * r.height; FX.burst(x, y, {n: 2, type: 'fiber', colors: ['#f6ead2', '#e8dcc0'], speed: [30, 140], size: [2, 4.5], g: 500, dur: [.4, .9]}); } Sfx.tear(); }
async function detach(i){
  if (S.busy || S.focus || S.phase !== 'sheet') return;
  const d = S.cells[i]; if (!d || d.label || d.taken) return;
  S.busy = true; Sfx.init();
  const fromBack = S.side === 'back';
  const el = $(`#face-${S.side} [data-i="${i}"]`), r = el.getBoundingClientRect();
  tearFX(r);
  const st = buildStamp(d, {withBack: true, stamped: d.revealed}); if (fromBack && !d.revealed) st.classList.add('facedown');
  const fly = document.createElement('div'); fly.className = 'fly'; fly.style.left = r.left + 'px'; fly.style.top = r.top + 'px'; fly.style.width = r.width + 'px'; fly.style.height = r.height + 'px'; fly.appendChild(st); document.body.appendChild(fly);
  d.taken = true; S.taken++; renderSheet();
  veil.classList.add('on'); focus.classList.add('on'); document.body.classList.add('focusing'); focus.classList.remove('show-info'); finfo.innerHTML = '';
  await new Promise(res => requestAnimationFrame(res));
  const to = fslot.getBoundingClientRect(), s = to.width / r.width;
  await fly.animate([{transform: 'none'}, {transform: `translate(${-r.width * .02}px,${-12}px) rotate(-4deg) scale(1.05)`}], {duration: D(200), easing: 'ease-out', fill: 'forwards'}).finished;
  Sfx.whoosh();
  await fly.animate([{transform: `translate(${-r.width * .02}px,-12px) rotate(-4deg) scale(1.05)`}, {transform: `translate(${to.left - r.left}px,${to.top - r.top}px) rotate(3deg) scale(${s * 1.04})`, offset: .8}, {transform: `translate(${to.left - r.left}px,${to.top - r.top}px) scale(${s})`}], {duration: D(720), easing: 'cubic-bezier(.3,.8,.25,1)', fill: 'forwards'}).finished;
  fslot.innerHTML = '<div class="tiltf"><div class="flipf"></div></div>'; $('.flipf', fslot).appendChild(st); fly.remove();
  S.focus = d;
  if (!d.revealed) await revealFocused(d, st); else { if (d.rarity === 'holo') Sfx.shimmer(); }
  d.revealed = true;
  finfo.innerHTML = `<div class="chips"><span class="chip ${d.rarity}">${RAR[d.rarity].label}</span>${d.isNew ? '<span class="chip new">Nouveau</span>' : '<span class="chip dup">Doublon</span>'}</div><h2 class="w-word">${d.word}</h2><p class="w-def"><em>${d.nature}</em>${d.def}</p><div class="acts"><button class="btn-primary" type="button" data-act="stow">Ranger ce timbre</button></div>`;
  focus.classList.add('show-info');
  S.busy = false; setTimeout(() => { const b = $('[data-act="stow"]', finfo); b && b.focus({preventScroll: true}); }, 60);
}
async function revealFocused(d, st){
  const flip = $('.flipf', fslot), rank = RAR[d.rarity].rank, r = fslot.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  if (rank >= 2){ Sfx.swell(rank === 3 ? 1.1 : .7); await flip.animate(Array.from({length: 14}, (_, k) => { const a = (rank === 3 ? 7 : 4) * k / 13 * (k === 13 ? 0 : 1); return {transform: `translate(${rand(-a, a).toFixed(1)}px,${rand(-a, a).toFixed(1)}px) rotate(${rand(-a * .4, a * .4).toFixed(2)}deg)`}; }), {duration: D(rank === 3 ? 1000 : 650), easing: 'ease-in'}).finished; }
  Sfx.whoosh();
  await flip.animate([{transform: 'rotateY(0deg) scale(1)'}, {transform: 'rotateY(90deg) scale(1.1)'}], {duration: D(170), easing: 'cubic-bezier(.5,0,1,1)'}).finished;
  st.classList.remove('facedown'); if (rank === 3) flashIt();
  await flip.animate([{transform: 'rotateY(-90deg) scale(1.1)'}, {transform: 'rotateY(0deg) scale(1)'}], {duration: D(rank ? 420 : 300), easing: 'cubic-bezier(.2,1.4,.4,1)'}).finished;
  await wait(90);
  const pm = $('.postmark', st); pm.animate([{opacity: 0, transform: 'scale(1.9)', filter: 'blur(3px)'}, {opacity: .82, transform: 'scale(1)', filter: 'blur(0)'}], {duration: D(190), easing: 'cubic-bezier(.6,0,.9,.5)', fill: 'forwards'}); st.classList.add('stamped'); Sfx.thud();
  if (rank === 1){ Sfx.chime(1); FX.burst(cx, cy, {n: 44, type: 'dust', colors: ['#ffe1a8', '#f0c48f', '#fff4d6'], speed: [60, 340], dur: [.7, 1.5]}); const f = $('.front .foil', st); f && f.animate([{backgroundPosition: '100% 50%'}, {backgroundPosition: '0% 50%'}], {duration: D(1000)}); }
  if (rank === 2){ Sfx.shimmer(); Sfx.chime(2); FX.burst(cx, cy, {n: 80, type: 'spark', colors: ['#ff7aa2', '#ffe07a', '#8dffc0', '#7fd8ff', '#c49bff'], speed: [140, 560], dur: [.6, 1.3], size: [1.2, 2.6]}); }
  if (rank === 3){ Sfx.boom(); FX.burst(cx, cy, {n: 130, type: 'confetti', colors: ['#f0c48f', '#d0243e', '#f6ecd6', '#3557a8'], speed: [220, 760], g: 720, dur: [1.4, 2.6], size: [5, 10], drag: .97}); await wait(420); const fm = $('.faute-mark', st); fm.animate([{opacity: 0, transform: 'scale(1.9)'}, {opacity: .94, transform: 'scale(1)'}], {duration: D(180), easing: 'cubic-bezier(.6,0,.9,.5)', fill: 'forwards'}); Sfx.thud(); }
}
async function stow(){
  if (!S.focus || S.busy) return; S.busy = true;
  const d = S.focus, st = $('.stamp', fslot), from = st.getBoundingClientRect();
  focus.classList.remove('show-info'); st.style.visibility = 'hidden';
  veil.classList.remove('on'); document.body.classList.remove('focusing');
  const thumbFrom = {left: from.left, top: from.top, width: from.width};
  const slot = nextTraySlot(); const thumb = buildStamp(d, {stamped: true}); slot.appendChild(thumb);
  const to = thumb.getBoundingClientRect(); thumb.style.transformOrigin = '0 0'; Sfx.pop();
  await thumb.animate([{transform: `translate(${thumbFrom.left - to.left}px,${thumbFrom.top - to.top}px) scale(${thumbFrom.width / to.width})`}, {transform: 'none'}], {duration: D(560), easing: 'cubic-bezier(.3,.9,.3,1)'}).finished;
  slot.classList.add('filled'); fslot.innerHTML = ''; focus.classList.remove('on');
  S.owned.add(d.word); S.focus = null; S.busy = false;
  if (S.taken >= 5) endPack(); else sheetInfo();
}
async function collectAll(){
  if (S.busy || S.focus || S.side !== 'front') return; S.busy = true; setInfo('');
  const idx = S.cells.map((d, i) => i).filter(i => !S.cells[i].label && !S.cells[i].taken);
  for (const i of idx){
    const d = S.cells[i], el = $(`#face-front .cell[data-i="${i}"]`); if (!el) continue;
    const r = el.getBoundingClientRect(); tearFX(r);
    d.taken = true; d.revealed = true; S.taken++; S.owned.add(d.word);
    const slot = nextTraySlot(), thumb = buildStamp(d, {stamped: true}); slot.appendChild(thumb);
    renderSheet();
    const to = thumb.getBoundingClientRect(); thumb.style.transformOrigin = '0 0';
    thumb.animate([{transform: `translate(${r.left - to.left}px,${r.top - to.top}px) scale(${r.width / to.width}) rotate(-6deg)`}, {transform: 'none'}], {duration: D(620), easing: 'cubic-bezier(.3,.9,.3,1)'}).finished.then(() => slot.classList.add('filled'));
    await wait(230);
  }
  await wait(500); S.busy = false; endPack();
}
async function endPack(){
  S.phase = 'end';
  const sw = $('#sheet-wrap');
  if (sw){ Sfx.whoosh(); await sw.animate([{opacity: 1, transform: 'none'}, {opacity: 0, transform: 'translateY(40px) rotate(-3deg) scale(.92)'}], {duration: D(600), easing: 'ease-in', fill: 'forwards'}).finished; }
  tray.classList.add('big');
  const counts = {}; S.cells.forEach(d => { if (!d.label) counts[d.rarity] = (counts[d.rarity] || 0) + 1; });
  const names = {courant: ['courant', 'courants'], dore: ['doré', 'dorés'], holo: ['holographique', 'holographiques'], faute: ['fauté', 'fautés']};
  const parts = ['courant', 'dore', 'holo', 'faute'].filter(k => counts[k]).map(k => `${counts[k]} ${names[k][counts[k] > 1 ? 1 : 0]}`);
  const txt = parts.length > 1 ? parts.slice(0, -1).join(', ') + ' et ' + parts[parts.length - 1] : parts[0];
  $('#stage').innerHTML = '';
  setInfo(`<h2 class="sum-title">Cinq timbres de plus.</h2><p class="sub-t">${txt}. La vignette d’édition reste dans le paquet.</p><div class="acts"><button class="btn-primary" type="button" data-act="album">Ranger dans l’album</button><button class="btn-secondary" type="button" data-act="again">Ouvrir un autre paquet</button></div>`);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b){ const a = b.dataset.act; if (a === 'auto-tear') autoTear(); else if (a === 'flip') flipSheet(); else if (a === 'collect') collectAll(); else if (a === 'stow') stow(); else if (a === 'again') startPack(); else if (a === 'album'){ toast(`Rangés. Ta collection compte ${S.owned.size} timbre${S.owned.size > 1 ? 's' : ''}.`); } return; }
  const c = e.target.closest('#face-front .cell, #face-back .bcell'); if (c) detach(+c.dataset.i);
  if (e.target.closest('#focus-slot') && S.focus) stow();
});
veil.addEventListener('click', () => { if (S.focus) stow(); });
const stage = $('#stage');
stage.addEventListener('pointerdown', e => { if (S.phase !== 'tear') return; tearing = true; lastX = e.clientX; acc = 0; refs.hint.classList.add('off'); try { stage.setPointerCapture(e.pointerId); } catch (_){} });
stage.addEventListener('pointermove', e => {
  if (S.phase === 'tear' && tearing){ const dx = e.clientX - lastX; lastX = e.clientX; if (dx > 0){ const w = refs.attached.getBoundingClientRect().width || 300; setTear(tearP + dx / w * 1.15); acc += dx; while (acc > 7){ acc -= 7; Sfx.grain(Math.min(1, dx / 12)); if (Math.random() < .5) fiberAt(); } if (tearP >= .9) completeTear(); } }
});
const endTear = () => { tearing = false; }; stage.addEventListener('pointerup', endTear); stage.addEventListener('pointercancel', endTear);
/* tilt & gum sheen */
const canHover = matchMedia('(hover: hover)').matches; let tx = 0, ty = 0, rx = 0, ry = 0;
addEventListener('pointermove', e => {
  const t = $('#tilt'); if (t){ const r = t.getBoundingClientRect(); const nx = (e.clientX - r.left) / r.width, ny = (e.clientY - r.top) / r.height; tx = clamp((ny - .5) * -7, -6, 6); ty = clamp((nx - .5) * 8, -7, 7); const g = $('#face-back .gum'); g && g.parentElement.style.setProperty('--mx', clamp(nx, 0, 1).toFixed(3)); }
  if (S.focus){ const tf = $('.tiltf', fslot); if (tf){ const r = fslot.getBoundingClientRect(), px = clamp(.5 + (e.clientX - (r.left + r.width / 2)) / (r.width * 1.3), 0, 1), py = clamp(.5 + (e.clientY - (r.top + r.height / 2)) / (r.height * 1.3), 0, 1); tf.style.transform = `rotateX(${((.5 - py) * 16).toFixed(2)}deg) rotateY(${((px - .5) * 20).toFixed(2)}deg)`; const st = $('.stamp', fslot); st.style.setProperty('--mx', px.toFixed(3)); st.style.setProperty('--my', py.toFixed(3)); st.style.setProperty('--gx', (px * 100).toFixed(1) + '%'); st.style.setProperty('--gy', (py * 100).toFixed(1) + '%'); } }
  if (S.phase === 'tear' && refs.tilt){ const r = refs.pack.getBoundingClientRect(); const dx = clamp((e.clientX - (r.left + r.width / 2)) / (innerWidth * .45), -1, 1), dy = clamp((e.clientY - (r.top + r.height / 2)) / (innerHeight * .45), -1, 1); refs.tilt.style.transform = `rotateX(${(-dy * 9).toFixed(2)}deg) rotateY(${(dx * 12).toFixed(2)}deg)`; refs.pack.style.setProperty('--mx', (.5 + dx / 2).toFixed(3)); refs.pack.style.setProperty('--gx', ((.5 + dx / 2) * 100).toFixed(1) + '%'); }
}, {passive: true});
(function loop(){ const t = $('#tilt'); if (t){ const idle = S.phase === 'sheet' && !S.busy && !S.focus && canHover && !reduced; rx = lerp(rx, idle ? tx : 0, .07); ry = lerp(ry, idle ? ty : 0, .07); t.style.transform = Math.abs(rx) + Math.abs(ry) < .02 ? '' : `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`; } requestAnimationFrame(loop); })();
addEventListener('keydown', e => { if (e.key === 'Escape' && S.focus) stow(); });
startPack();
})();
</script>
